<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Butcher's Bill — a Rite: sacrifice every unit you hold, then the enemy pays for it. -->
  <!-- the list of the dead: a sheet with names struck off -->
  <rect x="26" y="52" width="122" height="164" rx="10" fill="#2B4054"/>
  <g fill="#0C131B">
    <rect x="44" y="76" width="86" height="9" rx="4"/>
    <rect x="44" y="102" width="86" height="9" rx="4"/>
    <rect x="44" y="128" width="86" height="9" rx="4"/>
    <rect x="44" y="154" width="86" height="9" rx="4"/>
    <rect x="44" y="180" width="58" height="9" rx="4"/>
  </g>
  <!-- struck through in red: the ones already paid for -->
  <path d="M38 80 L136 80" stroke="#C73E3A" stroke-width="7" stroke-linecap="round"/>
  <path d="M38 106 L136 106" stroke="#C73E3A" stroke-width="7" stroke-linecap="round"/>
  <path d="M38 132 L136 132" stroke="#C73E3A" stroke-width="7" stroke-linecap="round"/>
  <!-- the cleaver, drawn LAST so it sits over the sheet rather than under it.
       A RECTANGULAR blade: the first pass drew a curved one and it read as a frying pan. -->
  <g transform="rotate(-38 150 130)">
    <rect x="40" y="119" width="102" height="24" rx="11" fill="#0C131B"/>
    <rect x="134" y="108" width="14" height="46" rx="5" fill="#0C131B"/>
    <rect x="146" y="84" width="98" height="94" rx="8" fill="#2B4054"/>
    <rect x="150" y="88" width="90" height="86" rx="6" fill="none" stroke="#0C131B" stroke-width="8"/>
    <circle cx="228" cy="104" r="8" fill="#0C131B"/>
    <rect x="146" y="166" width="98" height="12" rx="6" fill="#C73E3A"/>
  </g>
</svg>
