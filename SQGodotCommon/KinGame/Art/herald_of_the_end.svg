<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Herald of the End. On death it hits you: the announcement lands.
       The horn is a clear tapering cone with a flared bell — the first one was a grey wedge. -->
  <path d="M66 244 L80 138 q34 -16 68 0 L162 244 z" fill="#0C131B"/>
  <path d="M80 144 q-8 -52 34 -52 q42 0 34 52 q-34 14 -68 0 z" fill="#0C131B"/>
  <circle cx="100" cy="100" r="6" fill="#C73E3A"/>
  <circle cx="126" cy="100" r="6" fill="#C73E3A"/>
  <path d="M86 156 L54 206" stroke="#0C131B" stroke-width="15" stroke-linecap="round"/>
  <!-- the arm holding it up -->
  <path d="M142 134 L178 100" stroke="#0C131B" stroke-width="17" stroke-linecap="round"/>
  <!-- the horn: narrow mouthpiece bottom-left, flaring to a wide bell top-right -->
  <path d="M166 116 L196 88 L236 32 L250 44 L214 100 L184 130 z" fill="#2B4054"/>
  <path d="M226 22 L256 56 L212 74 L206 44 z" fill="#2B4054"/>
  <rect x="160" y="110" width="26" height="22" rx="8" fill="#0C131B"/>
  <!-- the sound, in flat arcs off the bell -->
  <g stroke="#C73E3A" stroke-width="8" stroke-linecap="round" fill="none">
    <path d="M196 20 L206 6"/>
    <path d="M232 10 L238 0"/>
  </g>
</svg>
