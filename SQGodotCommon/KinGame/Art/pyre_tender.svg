    <rect x="66" y="214" width="124" height="15" rx="7"/>
    <rect x="74" y="232" width="108" height="15" rx="7"/>
  </g>
  <!-- flame rising out of the stack -->
  <path d="M128 52 q40 56 32 100 q-6 32 -32 44 q-26 -12 -32 -44 q-8 -44 32 -100 z" fill="#8A4038"/>
