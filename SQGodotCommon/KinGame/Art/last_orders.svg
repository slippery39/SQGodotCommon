    <rect x="34" y="52" width="110" height="146" rx="8" transform="rotate(-13 89 125)"/>
    <rect x="76" y="48" width="110" height="146" rx="8" transform="rotate(-2 131 121)"/>
  </g>
  <rect x="96" y="46" width="118" height="156" rx="8" fill="#2B4054" stroke="#0C131B" stroke-width="7"/>
