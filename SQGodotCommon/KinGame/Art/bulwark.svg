<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Bulwark: a body behind a riot shield. Stands in the way. -->
  <g>
    <!-- braced legs, splayed, behind the shield -->
    <path d="M78 238 L104 170 L128 170 L112 238 z" fill="#0C131B"/>
    <path d="M178 238 L152 170 L128 170 L144 238 z" fill="#0C131B"/>
    <!-- head over the shield rim -->
    <path d="M110 74 q0 -26 18 -26 q18 0 18 26 q0 22 -18 22 q-18 0 -18 -22 z" fill="#0C131B"/>
    <rect x="106" y="70" width="44" height="14" rx="6" fill="#233444"/>
    <!-- the shield: the whole card -->
    <path d="M56 84 q72 -22 144 0 L196 186 q-12 34 -68 46 q-56 -12 -68 -46 z" fill="#1B2836" stroke="#0C131B" stroke-width="9"/>
    <!-- chevron, bone, the one bright mark -->
    <path d="M86 132 L128 108 L170 132" stroke="#E8EEF2" stroke-width="13" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M86 176 L128 152 L170 176" stroke="#E8EEF2" stroke-width="13" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
    <!-- viewport slit -->
    <rect x="104" y="92" width="48" height="9" rx="4" fill="#0C131B"/>
  </g>
</svg>
