<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Tollman. When the doom fires you pay: a bell, and an open hand. -->
  <path d="M78 244 L92 136 q36 -16 72 0 L178 244 z" fill="#0C131B"/>
  <path d="M92 142 q-8 -54 36 -54 q44 0 36 54 q-36 14 -72 0 z" fill="#0C131B"/>
  <circle cx="112" cy="100" r="6" fill="#C73E3A"/>
  <circle cx="144" cy="100" r="6" fill="#C73E3A"/>
  <!-- the open hand, held out flat: pay -->
  <path d="M96 152 L44 178" stroke="#0C131B" stroke-width="16" stroke-linecap="round"/>
  <path d="M12 168 q24 -12 40 2 q-14 18 -40 10 z" fill="#2B4054"/>
  <!-- the bell, raised -->
  <path d="M160 150 L204 112" stroke="#0C131B" stroke-width="16" stroke-linecap="round"/>
  <path d="M206 44 L206 70" stroke="#0C131B" stroke-width="9" stroke-linecap="round"/>
  <path d="M206 68 q34 0 38 44 q2 22 6 34 L162 146 q4 -12 6 -34 q4 -44 38 -44 z" fill="#2B4054"/>
  <rect x="156" y="140" width="100" height="14" rx="7" fill="#0C131B"/>
  <circle cx="206" cy="166" r="12" fill="#0C131B"/>
</svg>
